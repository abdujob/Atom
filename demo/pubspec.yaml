name: self_service_terminal
description: A self-service restaurant ordering terminal application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  cupertino_icons: ^1.0.5
  blue_thermal_printer:
    path: packages/blue_thermal_printer
  permission_handler: ^11.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  crypto: ^3.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
flutter:
  uses-material-design: true

  assets:
    - assets/images/  # Assure que ce chemin inclut tous les fichiers du dossier.
