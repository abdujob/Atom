name: self_service_terminal
description: A self-service restaurant ordering terminal application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  cupertino_icons: ^1.0.5
  blue_thermal_printer:
    path: packages/blue_thermal_printer
  permission_handler: ^11.0.1
  webview_flutter: ^4.9.0
  webview_flutter_android: ^3.16.9


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  # Mise à jour vers la version la plus récente.
  http: ^1.3.0
  url_launcher: ^6.1.14
flutter:
  uses-material-design: true

  assets:
    - assets/images/  # Assure que ce chemin inclut tous les fichiers du dossier.
